{% extends "base.html" %}
{% block title %}ログイン | 研究室統合プラットフォーム{% endblock %}
{% block heading %}ログイン{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">メールアドレス</label>
            <input type="email" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                   class="form-control" autocomplete="email" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">パスワード</label>
            <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                   class="form-control" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">ログイン</button>
          <input type="hidden" name="next" value="{{ next }}">
        </form>
      </div>
    </div>
    <p class="text-secondary small mt-3 mb-0">
      アカウントは管理者（教員／開発者）が管理画面から発行します。
    </p>
  </div>
</div>
{% endblock %}
