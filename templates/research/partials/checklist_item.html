{# チェックリストの1項目（htmx でのチェック切替の差し替え対象）#}
<li class="checklist-item form-check {% if item.done %}done{% endif %}" id="checklist-item-{{ item.pk }}">
  <input class="form-check-input" type="checkbox" id="item-{{ item.pk }}"
         {% if item.done %}checked{% endif %}
         hx-post="{% url 'research:checklist_item_toggle' item.conference_id item.pk %}"
         hx-target="#checklist-item-{{ item.pk }}"
         hx-swap="outerHTML"
         hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <label class="form-check-label" for="item-{{ item.pk }}">{{ item.item }}</label>
</li>
