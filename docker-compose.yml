# プロジェクト名を固定する。ディレクトリ名から自動生成させると、
# ディレクトリを移動・改名したときに別プロジェクト扱いになりDBボリュームを見失う。
name: labops

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 設定は .env.docker に集約する（ローカル開発用の .env とは分離）
    env_file:
      - .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # コンテナ内では必ず PostgreSQL の db サービスを使う
      USE_SQLITE: "0"
      POSTGRES_HOST: db
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # 学内ネットワーク限定公開。外部公開する場合は前段のFWで制御する
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  staticfiles:
  media:
